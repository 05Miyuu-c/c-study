<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C Study | プロC期末対策</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fa;color:#26364b;font:15px/1.8 system-ui,sans-serif}header{background:#18354b;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}button,input{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 16px;background:#176e70;color:white}button.alt{background:#e7eff2;color:#24525d}button:focus-visible,input:focus-visible{outline:3px solid #e8a53b}main{max-width:1150px;margin:auto;padding:24px;display:grid;grid-template-columns:280px 1fr;gap:24px}aside,article,.panel{background:white;border:1px solid #e1e8ee;border-radius:15px;padding:20px}aside{align-self:start}nav button{display:block;width:100%;text-align:left;background:transparent;color:#34495b;margin:4px 0}nav button.active{background:#e0f1ef;color:#126b65;font-weight:bold}h1{font-size:24px;line-height:1.4}h2{font-size:19px}h3{font-size:16px}small,.muted{color:#65798a}pre{background:#182c3d;color:#d9f5ed;padding:18px;border-radius:10px;overflow:auto;font:14px/1.7 monospace;white-space:pre}input{width:100%;padding:10px;border:1px solid #b8c8d3;border-radius:8px;margin:6px 0}progress{width:100%;accent-color:#17877d} .q{border-top:1px solid #e1e8ee;padding:16px 0}.feedback{white-space:pre-wrap;color:#175c57}.tag{color:#a65a16;background:#fff0d9;padding:3px 8px;border-radius:6px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.nodes{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}.node{border:2px solid #479b94;border-radius:8px;padding:8px 14px;background:#e6f6f2} @media(max-width:720px){main{display:block;padding:12px}aside{margin-bottom:14px;padding:12px}nav{display:grid;grid-template-columns:1fr 1fr}nav button{font-size:13px;padding:7px}article{padding:16px}header{padding:12px}h1{font-size:21px}}
</style><header><b>⌘ C Study</b><span>会津大学 · 期末試験対策</span></header><main><aside><b>学習ロードマップ</b><div id="progress"></div><nav id="nav"></nav><hr><div class="actions"><button class="alt" onclick="review()">苦手復習</button><button class="alt" onclick="mock()">模擬試験</button><button class="alt" onclick="home()">ホーム</button></div></aside><article id="content"></article></main><script>
const units=[
['ポインタ','& は住所、* はその住所にある値。宣言の int *p は int 型の変数を指すポインタを作る。p = &a で住所を保存し、*p = 30 で a を変更する。','int a = 10;\nint *p = &a;\n*p = 30;\nprintf("%d", a);','2019 問1-3：配列のポインタ渡し', [['a のアドレスを表す式は？','&a','& はアドレス演算子。'],['上のコードの出力は？','30','*p を通して a を変更した。'],['int a=10; int *p=&a; のとき *p+2 は？','12','値10に2を足す。'],['int x[]={3,8,9}; int *p=x; のとき *(p+1) は？','8','次の int 要素を参照する。']]],
['配列・文字列','配列名は多くの式で先頭要素へのポインタに変換される。文字列は末尾に \\0 が必要。strlen は終端を含まない長さ、strcmp は一致なら0。','char s[] = "Agano";\nprintf("%s", s+2);\n// ano','2020 問2：文字列・ポインタ演算',[['strlen("Agano") は？','5','終端は数えない。'],['char s[]="Agano"; sizeof(s) は？','6','終端も配列に含む。'],['s+2 を %s で表示すると？','ano','添字2から末尾まで。'],['strcmp(s,s) は？','0','一致すると0。']]],
['関数・変数','値渡しではコピーを受け取る。呼び出し元を書き換えるには住所を渡す。static 局所変数は関数の呼び出しをまたいで値を保持する。','void inc(int *p) { (*p)++; }\n// main 内\nint a=5;\ninc(&a);','2019 問1：変数の生存期間・関数',[['inc の呼び出し後の a は？','6','住所を経由して更新する。'],['inc に渡す式は？','&a','int * 型の引数。'],['局所変数の値を次の呼び出しまで保持するキーワードは？','static','静的記憶期間になる。']]],
['構造体','複数のデータを一つにまとめる。実体には .、ポインタには -> を使う。typedef で型に別名を付けられる。','typedef struct { int id; int score; } Student;\nStudent s = {1, 80};\nStudent *p = &s;\np->score = 90;','2020 問3（24点）：構造体・構造体配列',[['s の id を参照する式は？','s.id','実体はドット。'],['p から score を参照する式は？','p->score|(*p).score','ポインタはアロー演算子。'],['scanf で s.id を入力するための引数は？','&s.id','書き込み先の住所。'],['更新後の s.score は？','90','p は s を指している。']]],
['動的メモリ確保','malloc は指定バイト数の領域を確保し、失敗すると NULL を返す。使い終わった領域は free する。文字列は終端分を1バイト追加する。','int *p = malloc(5 * sizeof *p);\nif (p == NULL) exit(1);\np[0] = 42;\nfree(p);','2019 問3-2：文字列の動的確保',[['int 5個分の確保サイズの式は？','5*sizeof(int)|5*sizeof*p|5*sizeof(*p)','要素数×型のサイズ。'],['malloc 失敗時の戻り値は？','NULL','使用前に確認する。'],['p の領域を解放する文は？','free(p);|free(p)','二重解放に注意。'],['文字列 s をコピーするための必要バイト数は？','strlen(s)+1|1+strlen(s)','終端の分を足す。']]],
['連結リスト','ノードはデータと次のノードへの住所を持つ。ここでは head をダミーノードとする。finditem は一致したノードの直前を返す設計。挿入は新ノードの next を先につなぎ、削除は次へつなぎ直してから free する。','typedef struct node *NodePointer;\nstruct node { int key; NodePointer next; };\nNodePointer head;\n// p の直後に n を挿入\nn->next = p->next;\np->next = n;\n// p の直後を削除（存在する場合）\nNodePointer q = p->next;\np->next = q->next;\nfree(q);','2019 問6（13点）双方向／2020 問6（22点）一方向・置換・最大値。最新参考資料の概要も反映。',[['自己参照型構造体の next の型は？','NodePointer|struct node*','自分と同じ構造体へのポインタ。'],['先頭の実データを指す式は？','head->next','head はダミー。'],['末尾ノードの next は？','NULL','終端を示す。'],['n を p の直後に挿入：n->next = ?','p->next','元の後続を保存。'],['続いて p->next = ?','n','新ノードへつなぐ。'],['削除対象 q = ?','p->next','直後のノードを保存。'],['削除時 p->next = ?','q->next','対象を飛ばす。'],['削除対象を解放する文は？','free(q);|free(q)','つなぎ直してから解放。']]],
['ファイル入出力','FILE * はファイルを扱うためのポインタ。fopen の r は読み込み、w は書き込み。fgetc は EOF を表せるよう int で受け取る。','FILE *fp = fopen("data.txt", "r");\nif (fp == NULL) return 1;\nint c;\nwhile ((c = fgetc(fp)) != EOF) {\n    putchar(c);\n}\nfclose(fp);','2020 問1（20点）：ファイル・文字分類',[['読み込みモードは？','r|"r"','read の r。'],['fgetc の戻り値を受け取る型は？','int','EOF と文字を区別する。'],['ファイル終端を表すマクロは？','EOF','End Of File。'],['fp を閉じる文は？','fclose(fp);|fclose(fp)','使い終わったファイルを閉じる。']]],
['再帰関数','自分自身を呼ぶ関数。終了条件と、終了条件へ近づく再帰呼び出しが必要。呼び出し順を紙に書いて追うとよい。','int fib(int n) {\n    if (n <= 2) return 1;\n    return fib(n-1) + fib(n-2);\n}\nint gcd(int a,int b) {\n    if (b==0) return a;\n    return gcd(b,a%b);\n}','2019 問5：フィボナッチ／2020 問5：最大公約数',[['fib(5) は？','5','1,1,2,3,5。'],['gcd(16,12) は？','4','16%12=4、12%4=0。'],['gcd の終了条件は？','b==0|0==b','余りが0になる。'],['gcd(16,12) の呼び出し回数は？','3','(16,12),(12,4),(4,0)。']]],
['分割・条件コンパイル','ヘッダに型や関数宣言を置き、ソースを分割する。-c はオブジェクトファイルを作成。-D はマクロ定義。#ifdef は定義の有無を調べる。','gcc -c main.c util.c\ngcc main.o util.o -o app\n// 一括なら gcc main.c util.c -o app\n#ifdef DEBUG\nprintf("debug");\n#endif','2020 問4（16点）：分割コンパイル',[['main.c と util.c を一括で a.out にするコマンドは？','gcc main.c util.c|gcc util.c main.c','ヘッダは通常コマンドに入れない。'],['コンパイルのみ行うオプションは？','-c','リンクは別に行う。'],['DEBUG を定義するオプションは？','-DDEBUG|-D DEBUG','マクロを定義。'],['マクロが定義済みか調べる指令は？','#ifdef|ifdef','条件コンパイル。']]]];
let state={};try{state=JSON.parse(localStorage.getItem('cstudy-v1')||'{}')}catch(e){};let current=-1;const $=id=>document.getElementById(id), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const all=units.flatMap((u,i)=>u[4].map((q,j)=>({q,i,j,key:i+'-'+j})));function save(){try{localStorage.setItem('cstudy-v1',JSON.stringify(state))}catch(e){}}function sidebar(){let n=all.filter(x=>state[x.key]===true).length;$('progress').innerHTML=`<small>${n} / ${all.length} 問 正解済み</small><progress max="${all.length}" value="${n}"></progress>`;$('nav').innerHTML=units.map((u,i)=>`<button class="${current===i?'active':''}" onclick="lesson(${i})">${String(i+1).padStart(2,'0')} ${u[0]} ${i===5?'★':''} ${u[4].every((q,j)=>state[i+'-'+j]===true)?'✓':''}</button>`).join('')}
function home(){current=-1;sidebar();$('content').innerHTML=`<small>PROGRAMMING C / EXAM PREP</small><h1>今日も、ひとつずつ理解しよう。</h1><p>9単元・${all.length}問のオリジナル演習。解説を読んでから、答えを入力して確認しよう。</p><div class="panel"><span class="tag">重点対策</span><h2>連結リストをマスターする</h2><p>2019年度は13点、2020年度は22点の連結リスト問題が出題された。ポインタと構造体から順に学ぶと理解しやすい。</p><button onclick="lesson(5)">連結リストの授業へ</button> <button class="alt" onclick="lesson(0)">基礎から始める</button></div><h2>教材について</h2><p>2019・2020年度期末問題の確認できた箇所、2020年度解答、および最新参考資料の会話上の概要をもとに構成。問題は過去問そのものではなく類題。全年度の出題頻度は未集計。</p><p class="muted">進捗は同じブラウザのローカル保存に対応（環境によって保存できない場合あり）。Cの実行環境は内蔵していません。</p>`}
function questions(items){return items.map((x,k)=>`<div class="q"><small>QUESTION ${k+1} · ${units[x.i][0]}</small><div>${esc(x.q[0])}</div><input id="a${k}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="答えを入力" aria-label="問題${k+1}の答え"><button class="alt" onclick="grade(${k})">答え合わせ</button> <button class="alt" onclick="hint(${k})">解説を見る</button><div class="feedback" id="f${k}" aria-live="polite"></div></div>`).join('')}
let shown=[];function norm(s){return s.trim().replace(/\s+/g,'').replace(/;$/,'')}function grade(k){let x=shown[k],a=$('a'+k).value,ok=x.q[1].split('|').some(v=>norm(v)===norm(a));state[x.key]=ok;save();sidebar();$('f'+k).textContent=(ok?'✓ 正解！':'もう一度考えてみよう。 正答例：'+x.q[1].split('|')[0])+'\n'+x.q[2];return ok}function hint(k){$('f'+k).textContent=shown[k].q[2]+'\n正答例：'+shown[k].q[1].split('|')[0]}
function lesson(i){current=i;sidebar();let u=units[i];shown=all.filter(x=>x.i===i);$('content').innerHTML=`<small>LESSON ${i+1} / 9</small><h1>${u[0]}</h1><p class="muted">出題例：${esc(u[3])}</p><h2>01 基礎を理解する</h2><p>${esc(u[1])}</p><h2>02 コードを読む</h2><pre>${esc(u[2])}</pre>${i===0?'<h3>動かして理解する</h3><div class="nodes"><span class="node">p: 0x100</span> → <span class="node">a: <b id="val">10</b></span></div><div class="actions"><button onclick="$(\'val\').textContent=10">*p = 10</button><button onclick="$(\'val\').textContent=30">*p = 30</button></div>':i===5?'<h3>ノードを操作する</h3><div id="nodes" class="nodes"></div><div class="actions"><button onclick="arr.splice(1,0,20);draw()">10の後に20を挿入</button><button onclick="if(arr.length>1)arr.splice(1,1);draw()">10の直後を削除</button><button class="alt" onclick="arr=[10,30];draw()">リセット</button></div><p>矢印は next。削除後は次のノードにつなぎ直す。</p>':''}<h2>03 確認テスト</h2>${questions(shown)}<div class="actions"><button onclick="${i<8?'lesson('+(i+1)+')':'home()'}">${i<8?'次の単元へ':'ホームへ'}</button></div>`;if(i===5){arr=[10,30];draw()}window.scrollTo(0,0)}let arr=[10,30];function draw(){$('nodes').innerHTML=['head',...arr,'NULL'].map((x,i)=>`<span class="node">${x}</span>${i<arr.length+1?' → ':''}`).join('')}
function review(){current=-1;sidebar();shown=all.filter(x=>state[x.key]===false);$('content').innerHTML='<h1>苦手復習</h1><p>最後の回答が不正解だった問題を集めています。</p>'+(shown.length?questions(shown):'<p>復習対象はまだありません。</p>');window.scrollTo(0,0)}function mock(){current=-1;sidebar();shown=units.flatMap((u,i)=>all.filter(x=>x.i===i).slice(0,i===5?4:2));$('content').innerHTML='<h1>総合模擬試験</h1><p>20問の短縮版。過去問形式を参考にした類題です。</p>'+questions(shown)+'<button onclick="finish()">採点する</button><p id="score" aria-live="polite"></p>';window.scrollTo(0,0)}function finish(){let n=shown.map((x,k)=>grade(k)).filter(Boolean).length;$('score').textContent=`結果：${n} / ${shown.length} 問正解（${Math.round(n/shown.length*100)}%）`;}home();</script></html>
